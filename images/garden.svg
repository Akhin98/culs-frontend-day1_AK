<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400">
  <!-- sky, sun and grass -->
  <rect width="600" height="400" fill="#dff0f7" />
  
  <!-- Sun with pulse animation -->
  <circle cx="510" cy="75" r="40" fill="#f6d365">
    <animate attributeName="r" values="40; 43; 40" dur="4s" repeatCount="indefinite" />
  </circle>
  
  <rect y="250" width="600" height="150" fill="#9cc58a" />

  <!-- the left bed: basil and sage -->
  <g fill="#3f8a4a">
    <ellipse cx="80" cy="235" rx="30" ry="34" />
    <ellipse cx="140" cy="228" rx="34" ry="40" />
    <ellipse cx="205" cy="236" rx="30" ry="32" />
    <ellipse cx="255" cy="240" rx="22" ry="26" />
  </g>
  <g fill="#8fb39a">
    <ellipse cx="112" cy="250" rx="20" ry="16" />
    <ellipse cx="232" cy="252" rx="18" ry="14" />
  </g>
  <rect x="40" y="250" width="240" height="70" rx="6" fill="#7a5a43" />

  <!-- the right bed: lavender with swaying animation -->
  <g>
    <!-- Sway animation applied to the whole lavender group. 
         The transform-origin is set near the top of the planter box (y=250) -->
    <animateTransform attributeName="transform" type="rotate" values="-2 440 250; 2 440 250; -2 440 250" dur="3.5s" repeatCount="indefinite" />
    
    <g stroke="#4f7a45" stroke-width="4" stroke-linecap="round">
      <path d="M350 250 V185" />
      <path d="M385 250 V170" />
      <path d="M420 250 V180" />
      <path d="M455 250 V165" />
      <path d="M490 250 V178" />
      <path d="M525 250 V188" />
    </g>
    <g fill="#8e6cc0">
      <ellipse cx="350" cy="180" rx="7" ry="16" />
      <ellipse cx="385" cy="165" rx="7" ry="16" />
      <ellipse cx="420" cy="175" rx="7" ry="16" />
      <ellipse cx="455" cy="160" rx="7" ry="16" />
      <ellipse cx="490" cy="173" rx="7" ry="16" />
      <ellipse cx="525" cy="183" rx="7" ry="16" />
    </g>
  </g>
  <rect x="320" y="250" width="240" height="70" rx="6" fill="#7a5a43" />

  <!-- a bee with hovering animation -->
  <g>
    <!-- This animateTransform adds an up/down bobbing motion on top of the bee's base position -->
    <animateTransform attributeName="transform" type="translate" values="300 120; 300 110; 300 120" dur="1.5s" repeatCount="indefinite" />
    
    <!-- Left Wing with fast fluttering -->
    <ellipse cx="-6" cy="-12" rx="10" ry="7" fill="#ffffff" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" values="15 -6 -12; -15 -6 -12; 15 -6 -12" dur="0.1s" repeatCount="indefinite" />
    </ellipse>
    <!-- Right Wing with fast fluttering -->
    <ellipse cx="6" cy="-12" rx="10" ry="7" fill="#ffffff" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" values="-15 6 -12; 15 6 -12; -15 6 -12" dur="0.1s" repeatCount="indefinite" />
    </ellipse>
    
    <ellipse cx="0" cy="0" rx="16" ry="11" fill="#f2c230" />
    <path d="M-5 -10 V10 M5 -10 V10" stroke="#2b2b2b" stroke-width="4" />
    <circle cx="16" cy="-2" r="2" fill="#2b2b2b" />
  </g>
</svg>
